<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FROG FARM Admin</title>
<style>
:root{--line:rgba(255,255,255,.14);--panel:rgba(255,255,255,.06);--mute:#8e8e93;--glow:90,220,130;--ok:#3ecf8e;--bad:#ff5d5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 12px calc(24px + env(safe-area-inset-bottom));max-width:640px;margin:auto}
h2{margin:16px 0 4px}
p,small{color:var(--mute);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
button,input,textarea{font:inherit;border-radius:12px}
button{border:0;background:#fff;color:#000;font-weight:800;padding:10px 14px}
button.alt{background:transparent;color:#fff;border:1px solid var(--line)}
button.ok{background:var(--ok)}button.bad{background:var(--bad);color:#fff}
button:disabled{opacity:.4}
input,textarea{width:100%;padding:12px;background:#0b0b0b;color:#fff;border:1px solid var(--line);margin-top:8px}
textarea{min-height:90px;font-family:monospace;font-size:12px}
.tabs{display:flex;gap:6px;position:sticky;top:0;background:#000;padding:10px 0;z-index:2;overflow-x:auto}
.tabs button{flex:1;background:transparent;color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:#fff;color:#000;box-shadow:0 0 18px rgba(var(--glow),.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12)}
.tag.paid{background:var(--ok);color:#000}.tag.rejected{background:var(--bad)}
.w{word-break:break-all;font-family:monospace;font-size:12px;color:#cde;background:#0b0b0b;border-radius:8px;padding:6px;margin:6px 0}
.field2{margin-top:8px}.field2 label,.lab{font-size:12px;color:var(--mute);display:block;margin-top:8px}.seven{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.seven input{padding:8px 2px;text-align:center}.odd{align-items:center}.odd input{flex:1;margin-top:0}
.btns{display:flex;gap:8px;margin-top:8px}.btns button{flex:1}
#login{margin-top:30vh;text-align:center}
</style></head>
<body>
<div id="login" style="display:none">
 <h2>FROG FARM Admin</h2><p>Enter your admin key.</p>
 <input id="key" type="password" placeholder="Admin key" autocomplete="off">
 <button id="go" style="width:100%;margin-top:10px">Sign in</button><p id="lerr" style="color:var(--bad)"></p>
</div>
<div id="app" style="display:none">
 <div class="tabs" id="tabs"><button data-t="stats" class="on">Stats</button><button data-t="wd">Withdrawals</button><button data-t="users">Users</button><button data-t="refs">Referrals</button><button data-t="tasks">Tasks</button><button data-t="bc">Broadcast</button><button data-t="logs">Logs</button><button data-t="set">Settings</button><button id="out">Exit</button></div>
 <div id="v"></div>
</div>
<script>
const API="https://ytrvqpjdghvjcjwtscyv.supabase.co/functions/v1/dogs-admin";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString();
let KEY="";try{KEY=sessionStorage.getItem("dk")||""}catch(e){}
async function call(action,extra){
 let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({key:KEY,action},extra||{}))})}catch(e){throw new Error("Network problem")}
 if(r.status===401){logout();throw new Error("Wrong key")}
 const j=await r.json();if(j.error)throw new Error(j.error);return j.data}
function logout(){KEY="";try{sessionStorage.removeItem("dk")}catch(e){}show()}
function show(){$("login").style.display=KEY?"none":"block";$("app").style.display=KEY?"block":"none";if(KEY)tab("stats")}
$("go").onclick=async()=>{KEY=$("key").value.trim();if(!KEY)return;$("lerr").textContent="Checking…";
 try{await call("stats");try{sessionStorage.setItem("dk",KEY)}catch(e){}$("lerr").textContent="";$("key").value="";show()}catch(e){KEY="";$("lerr").textContent=e.message}};
$("out").onclick=logout;
$("tabs").onclick=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t)tab(t)};
function tab(t){document.querySelectorAll("#tabs button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===t));({stats,wd:()=>wd("pending"),users:()=>users(""),tasks:tasksView,bc:bcView,refs:refsView,logs:()=>logsView("tx"),set:settings})[t]()}
const err=e=>{$("v").innerHTML='<div class="card" style="color:var(--bad)">'+esc(e.message)+'</div>'};
const load=()=>{$("v").innerHTML="<p>Loading…</p>"};

async function stats(){load();try{const s=await call("stats");
 $("v").innerHTML=`<h2>Overview</h2><div class="grid">
 <div class="stat"><b>${fmt(s.users)}</b><small>Users</small></div><div class="stat"><b>${fmt(s.new_today)}</b><small>New today</small></div>
 <div class="stat"><b>${fmt(s.pending_count)}</b><small>Pending withdrawals</small></div><div class="stat"><b>${(+s.pending_sum).toFixed(4)}</b><small>Pending TON to pay</small></div>
 <div class="stat"><b>${fmt(s.paid_count)}</b><small>Paid withdrawals</small></div><div class="stat"><b>${(+s.paid_sum).toFixed(4)}</b><small>TON paid out</small></div>
 <div class="stat"><b>${fmt(s.total_balance)}</b><small>FROGS held by users</small></div><div class="stat"><b>${(+s.ton_held).toFixed(4)}</b><small>TON held by users</small></div><div class="stat"><b>${fmt(s.banned)}</b><small>Banned</small></div></div>`}catch(e){err(e)}}

async function wd(st){load();try{const d=await call("withdrawals",{status:st});
 const bar=["pending","paid","rejected"].map(x=>`<button class="${x===st?"":"alt"}" onclick="wd('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("");
 $("v").innerHTML=`<h2>Withdrawals</h2><div class="btns">${bar}</div>`+(d.length?d.map(w=>`<div class="card">
  <div class="row"><b>${(w.amount/1e9).toFixed(4)} TON</b><span class="tag ${w.status}">${w.status}</span></div>
  <small>${esc(w.users&&w.users.first_name||"User")} · ID ${w.tg_id} · ${esc(String(w.created_at).slice(0,16).replace("T"," "))}</small>
  <div class="row"><span>Send to user (after fee)</span><b>${(w.net/1e9).toFixed(4)} TON</b></div>
  <div class="w" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.textContent);this.style.outline='1px solid #3ecf8e'">${esc(w.wallet)}</div><small>Tap the address to copy</small>
  ${w.status==="pending"?`<div class="btns"><button class="ok" onclick="setW('${w.id}','paid')">Mark paid</button><button class="bad" onclick="setW('${w.id}','rejected')">Reject</button></div>`:""}</div>`).join(""):"<p>Nothing here.</p>")}catch(e){err(e)}}
async function setW(id,s){
 const msg=s==="paid"?"Mark as PAID? Do this only after you have sent the FROGS. It also releases the inviter's bonus.":"REJECT and refund the full amount to the user?";
 if(!confirm(msg))return;
 try{const r=await call("setWithdrawal",{id,status:s});if(r&&r.error)throw new Error(r.error);wd("pending")}catch(e){alert("Failed: "+e.message)}}

async function users(q){$("v").innerHTML=`<h2>Users</h2><input id="uq" placeholder="Search name or Telegram ID" value="${esc(q)}"><button style="width:100%;margin-top:8px" onclick="users(document.getElementById('uq').value)">Search</button><div id="ul"><p>Loading…</p></div>`;
 try{const d=await call("users",{q});$("ul").innerHTML=d.length?d.map(u=>`<div class="card" onclick="user(${u.tg_id})"><div class="row"><b>${esc(u.first_name||"User")}</b><span>${fmt(u.balance)} FROGS</span></div><small>ID ${u.tg_id}${u.banned?" · BANNED":""}${u.dup_blocked?" · device blocked":""}${u.ref_blocked?" · referral blocked":""}${u.has_withdrawn?" · has withdrawn":""}</small></div>`).join(""):"<p>No users found.</p>"}catch(e){$("ul").innerHTML=esc(e.message)}}
async function user(id){load();try{const d=await call("user",{id});const u=d.user;if(!u)return err(new Error("User not found"));
 $("v").innerHTML=`<button class="alt" onclick="users('')">← Back</button><h2>${esc(u.first_name||"User")}</h2><p>ID ${u.tg_id} · joined ${esc(String(u.created_at).slice(0,10))}</p>
 <div class="grid"><div class="stat"><b>${fmt(u.balance)}</b><small>FROGS</small></div><div class="stat"><b>${((u.ton_nano||0)/1e9).toFixed(4)}</b><small>TON</small></div><div class="stat"><b>${fmt(d.friends)}</b><small>Friends</small></div></div>
 <div class="btns"><button class="${u.banned?"ok":"bad"}" onclick="ban(${u.tg_id},${!u.banned})">${u.banned?"Unban user":"Ban user"}</button><button class="alt" onclick="refBlock(${u.tg_id},${!u.ref_blocked})">${u.ref_blocked?"Allow referral bonus":"Block referral bonus"}</button></div>
 ${u.dup_blocked||u.device_allowed?`<div class="card"><b>📱 Device limit</b><p>${u.dup_blocked?"This account is blocked because another account uses the same device.":"You allowed this account to earn on a shared device."}</p><button style="width:100%" onclick="devAllow(${u.tg_id},${!u.device_allowed})">${u.device_allowed?"Remove permission":"Allow this account"}</button></div>`:""}
 <p>Opened with link code: <b>${esc(u.last_start||"none")}</b> · Invited by: <b>${u.referrer_id||"nobody"}</b></p>
 ${u.referrer_id?"":`<div class="card"><b>Link to inviter</b><p>Use this when someone opened the app before using the invite link. The inviter is paid for every step this user has already reached.</p><input id="refSet" inputmode="numeric" placeholder="Inviter's Telegram ID"><button style="width:100%;margin-top:8px" onclick="setRef(${u.tg_id})">Link and pay inviter</button></div>`}
 <div class="card"><b>Add or remove FROGS</b><input id="adjAmt" type="number" inputmode="numeric" placeholder="Amount"><input id="adjWhy" placeholder="Reason (optional)"><div class="btns"><button class="ok" onclick="adj(${u.tg_id},1)">Add</button><button class="bad" onclick="adj(${u.tg_id},-1)">Remove</button></div></div>
 <div class="card"><b>Add or remove TON</b><input id="tonAmt" type="number" step="any" placeholder="Amount in TON"><input id="tonWhy" placeholder="Reason (optional)"><div class="btns"><button class="ok" onclick="adjT(${u.tg_id},1)">Add</button><button class="bad" onclick="adjT(${u.tg_id},-1)">Remove</button></div></div>
 <div class="card"><b>Friends invited (${d.friends})</b>${d.friend_list&&d.friend_list.length?d.friend_list.map(f=>`<div class="row"><span>${esc(f.first_name||"User")}</span><a href="#" style="color:#fff" onclick="user(${f.tg_id});return false">${f.tg_id}</a></div>`).join(""):"<p>None</p>"}</div>
 <div class="card"><b>Recent activity</b>${d.ledger.length?d.ledger.map(l=>`<div class="row"><span>${esc(l.reason)}<br><small>${esc(String(l.created_at).slice(0,16).replace("T"," "))}</small></span><b style="color:${l.amount<0?"var(--bad)":"var(--ok)"}">${l.amount>0?"+":""}${fmt(l.amount)}</b></div>`).join(""):"<p>No activity.</p>"}</div>`}catch(e){err(e)}}
async function ban(id,b){if(!confirm(b?"Ban this user? They will not be able to earn or withdraw.":"Unban this user?"))return;try{await call("ban",{id,banned:b});user(id)}catch(e){alert(e.message)}}


let SET={};
const GN={wheel:"Lucky wheel",bones:"Fly catch",memory:"Memory match",cups:"Find the fly",dig:"Treasure dig",tap:"Tap rush",react:"Quick tongue"};
const gv=id=>+document.getElementById(id).value;
const numF=(id,label,val)=>`<div class="field2"><label>${label}</label><input id="${id}" type="number" step="any" value="${esc(val)}"></div>`;
async function settings(){load();try{const [d,ch]=await Promise.all([call("settings"),call("getChannel")]);SET={};d.forEach(s=>SET[s.key]=s.value);
 const c=SET.claim,w=SET.withdraw,s=SET.swap,r=SET.referral,ad=SET.ads,wl=SET.welcome,mj=SET.must_join,chs=mj.channels||[],dv=SET.device,am=SET.ad_milestones||{enabled:false,list:[]};
 $("v").innerHTML=`<h2>Settings</h2><p>Changes apply to every user straight away.</p>
 <div class="card"><b>📡 Payment channel</b><p>Withdrawal requests and approvals are posted here. Add your bot as an admin of the channel first.</p><input id="chan" placeholder="@yourchannel" value="${esc(ch.chat_id)}"><div class="btns"><button onclick="saveChan()">Save</button><button class="alt" onclick="testChan()">Send test</button></div></div>
 <div class="card"><b>🤖 Bot and Mini App link</b><p>Used to build every invite link. If you made your Mini App with BotFather /newapp, enter its short name. That makes Telegram show the "Terms of Service / Allow messages" popup on first launch.</p><input id="botName" placeholder="Bot username, no @" value="${esc(SET.app.bot)}"><input id="botShort" placeholder="Mini App short name (optional)" value="${esc(SET.app.short||"")}"><button style="width:100%;margin-top:8px" onclick="saveApp()">Save</button></div>
 <div class="card"><b>🎉 Welcome bonus</b><p>Paid once to every brand-new user when they first open the app.</p><label class="lab"><input id="wl_on" type="checkbox" style="width:auto;margin-right:8px" ${wl.enabled?"checked":""}>Welcome bonus is on</label>${numF("wl_amt","Bonus (FROGS)",wl.amount)}<button style="width:100%;margin-top:10px" onclick="saveWelcome()">Save</button></div>
 <div class="card"><b>🔒 Must-join channels</b><p>People must join these before they can use the app. Your bot must be an admin in each channel so it can check.</p><label class="lab"><input id="mj_on" type="checkbox" style="width:auto;margin-right:8px" ${mj.enabled?"checked":""}>Require joining</label>${[0,1,2].map(i=>{const c=chs[i]||{};return `<div style="margin-top:10px"><input id="mj_t${i}" placeholder="Channel name ${i+1}" value="${esc(c.title||"")}"><input id="mj_c${i}" placeholder="@channelusername" value="${esc(c.chat||"")}"><input id="mj_u${i}" placeholder="Join link (filled in for you)" value="${esc(c.url||"")}"></div>`}).join("")}<div class="btns"><button onclick="saveMJ()">Save</button><button class="alt" onclick="checkMJ()">Check bot access</button></div></div>
 <div class="card"><b>📱 One account per device</b><p>The first account that opens the app on a phone keeps earning. Other Telegram accounts on that same phone are blocked. You can allow a person from their page.</p><label class="lab"><input id="dv_on" type="checkbox" style="width:auto;margin-right:8px" ${dv.enabled?"checked":""}>Limit is on</label>${numF("dv_max","Accounts allowed per device",dv.max)}<button style="width:100%;margin-top:10px" onclick="saveDevice()">Save</button></div>
 <div class="card"><b>🎁 Claim, check-in and plays</b><div class="grid">${numF("cl_amt","Claim amount (FROGS)",c.amount)}${numF("cl_hrs","Hours between claims",c.hours)}</div>${numF("gpd","Plays per game per day",SET.games_per_day)}<label class="lab">Check-in rewards, day 1 to 7</label><div class="seven">${SET.checkin.map((v,i)=>`<input id="ci${i}" type="number" value="${esc(v)}">`).join("")}</div><button style="width:100%;margin-top:10px" onclick="saveRewards()">Save</button></div>
 <div class="card"><b>👥 Referral rewards per friend</b>${numF("rf_o","Friend opens the app",r.open)}${numF("rf_t","Friend finishes every task",r.tasks)}${numF("rf_w","Friend's first withdrawal is paid",r.withdraw)}<button style="width:100%;margin-top:10px" onclick="saveRef()">Save</button></div>
 <div class="card"><b>📺 Watch-to-earn ads</b><p>Users earn this for every ad they finish.</p><label class="lab"><input id="ad_on" type="checkbox" style="width:auto;margin-right:8px" ${ad.enabled?"checked":""}>Ads are on</label>${numF("ad_rw","Reward per ad (FROGS)",ad.reward)}<div class="grid">${numF("ad_cap","Ads per user per day",ad.daily_cap)}${numF("ad_cd","Seconds between ads",ad.cooldown_sec)}</div>${numF("ad_min","Minimum seconds to watch",ad.min_watch_sec)}${numF("ad_wd","Ads to watch before each withdrawal (0 turns it off)",ad.withdraw_ads||0)}<label class="lab"><input id="ad_vf" type="checkbox" style="width:auto;margin-right:8px" ${ad.verify?"checked":""}>Require ad-network confirmation (advanced, needs the postback link)</label><button style="width:100%;margin-top:10px" onclick="saveAds()">Save</button></div>
 <div class="card"><b>🎁 Ad milestones</b><p>A one-time TON reward when a user has watched this many ads in total. Leave a row empty to remove it.</p><label class="lab"><input id="am_on" type="checkbox" style="width:auto;margin-right:8px" ${am.enabled?"checked":""}>Milestone rewards are on</label>${[0,1,2,3,4].map(i=>{const e=(am.list||[])[i]||{};return `<div class="grid" style="margin-top:8px"><input id="am_a${i}" type="number" placeholder="Ads watched" value="${esc(e.ads||"")}"><input id="am_t${i}" type="number" step="any" placeholder="Reward in TON" value="${esc(e.ton||"")}"></div>`}).join("")}<button style="width:100%;margin-top:10px" onclick="saveMS()">Save</button></div>
 <div class="card"><b>🔄 Swap FROGS to TON</b><div class="grid">${numF("sw_f","FROGS",s.frogs)}${numF("sw_t","equals TON",s.ton)}</div><div class="grid">${numF("sw_fee","Swap fee %",Math.round(s.fee*10000)/100)}${numF("sw_min","Minimum swap (FROGS)",s.min_frogs)}</div><button style="width:100%;margin-top:10px" onclick="saveSwap()">Save</button></div>
 <div class="card"><b>💎 TON withdrawals</b><div class="grid">${numF("wd_min","Minimum TON",w.min)}${numF("wd_max","Maximum TON",w.max)}</div>${numF("wd_fee","Withdrawal fee %",Math.round(w.fee*10000)/100)}<button style="width:100%;margin-top:10px" onclick="saveWd()">Save</button></div>
 <div class="card"><b>🎲 Game prizes and chances</b><p>Each row is a prize and its weight. A bigger weight comes up more often. A prize of 0 means no win.</p>${Object.keys(SET.odds).map(oddsCard).join("")}</div>`}catch(e){err(e)}}
function oddsCard(g){const rows=SET.odds[g],tot=rows.reduce((s,e)=>s+e[1],0);
 return `<div style="margin-top:14px"><b>${esc(GN[g]||g)}</b><div id="od_${g}">${rows.map(e=>oddRow(e,tot)).join("")}</div><div class="btns"><button class="alt" onclick="addOdd('${g}')">+ Add prize</button><button onclick="saveOdds('${g}')">Save</button></div></div>`}
function oddRow(e,tot){return `<div class="row odd"><input type="number" value="${esc(e[0])}" placeholder="Prize"><input type="number" value="${esc(e[1])}" placeholder="Weight"><small style="min-width:40px">${tot?Math.round(e[1]/tot*1000)/10:0}%</small><button class="alt" style="padding:6px 10px;flex:0" onclick="this.parentNode.remove()">✕</button></div>`}
function addOdd(g){document.getElementById("od_"+g).insertAdjacentHTML("beforeend",oddRow([0,1],0))}
async function setMany(list,label){if(!confirm("Save "+label+"? It applies to all users immediately."))return;
 try{for(const [name,val] of list)await call("setSetting",{name,value:JSON.stringify(val)});alert("Saved");settings()}catch(e){alert("Not saved: "+e.message)}}
function saveOdds(g){const rows=[...document.querySelectorAll("#od_"+g+" .odd")].map(r=>{const i=r.querySelectorAll("input");return [+i[0].value,+i[1].value]});const all=JSON.parse(JSON.stringify(SET.odds));all[g]=rows;setMany([["odds",all]],GN[g])}
function saveRewards(){setMany([["claim",{amount:gv("cl_amt"),hours:gv("cl_hrs")}],["games_per_day",gv("gpd")],["checkin",[0,1,2,3,4,5,6].map(i=>gv("ci"+i))]],"these rewards")}
function saveAds(){setMany([["ads",{enabled:document.getElementById("ad_on").checked,reward:gv("ad_rw"),daily_cap:gv("ad_cap"),cooldown_sec:gv("ad_cd"),min_watch_sec:gv("ad_min"),withdraw_ads:gv("ad_wd"),verify:document.getElementById("ad_vf").checked}]],"the ad settings")}
function saveMS(){const list=[0,1,2,3,4].map(i=>({ads:Math.floor(gv("am_a"+i)),ton:gv("am_t"+i)})).filter(x=>x.ads>0&&x.ton>0);
 const seen=new Set();for(const x of list){if(seen.has(x.ads))return alert("Two rows have the same number of ads");seen.add(x.ads)}
 setMany([["ad_milestones",{enabled:document.getElementById("am_on").checked,list}]],"the ad milestones")}
function saveRef(){setMany([["referral",{open:gv("rf_o"),tasks:gv("rf_t"),withdraw:gv("rf_w")}]],"the referral rewards")}
function saveSwap(){setMany([["swap",{frogs:gv("sw_f"),ton:gv("sw_t"),fee:gv("sw_fee")/100,min_frogs:gv("sw_min")}]],"the swap rules")}
function saveWd(){setMany([["withdraw",{min:gv("wd_min"),max:gv("wd_max"),fee:gv("wd_fee")/100}]],"the withdrawal rules")}
function saveApp(){setMany([["app",{bot:document.getElementById("botName").value.trim().replace(/^@/,""),short:document.getElementById("botShort").value.trim()}]],"the bot settings")}
function saveDevice(){setMany([["device",{enabled:document.getElementById("dv_on").checked,max:gv("dv_max")}]],"the device limit")}
async function devAllow(id,v){if(!confirm(v?"Allow this account to earn on this device?":"Remove the permission?"))return;try{await call("deviceAllow",{id,allowed:v});refsView()}catch(e){alert(e.message)}}
function saveWelcome(){setMany([["welcome",{enabled:document.getElementById("wl_on").checked,amount:gv("wl_amt")}]],"the welcome bonus")}
function saveMJ(){const channels=[0,1,2].map(i=>{const t=document.getElementById("mj_t"+i).value.trim(),c=document.getElementById("mj_c"+i).value.trim();let u=document.getElementById("mj_u"+i).value.trim();if(!t&&!c&&!u)return null;if(!u&&/^@/.test(c))u="https://t.me/"+c.slice(1);return{title:t,chat:c,url:u}}).filter(Boolean);
 setMany([["must_join",{enabled:document.getElementById("mj_on").checked,channels}]],"the must-join channels")}
async function checkMJ(){try{const r=await call("checkChannels");alert(r.length?r.map(x=>(x.ok?"✅ ":"⚠️ ")+x.title+": "+x.note).join("\n"):"No channels saved yet. Save them first.")}catch(e){alert(e.message)}}
async function saveChan(){try{await call("setChannel",{chat_id:document.getElementById("chan").value.trim()});alert("Channel saved")}catch(e){alert(e.message)}}
async function testChan(){try{const r=await call("testChannel");alert(r.ok?"Test message sent. Check your channel.":"Not sent: "+(r.description||"unknown error")+". Make sure the bot is an admin of the channel.")}catch(e){alert(e.message)}}
async function setRef(id){const v=document.getElementById("refSet").value.trim();if(!/^\d{1,15}$/.test(v))return alert("Enter the inviter's Telegram ID (numbers only)");
 if(!confirm("Link this user to inviter "+v+"? The inviter is paid now."))return;
 try{await call("setReferrer",{id,ref:v});alert("Linked");user(id)}catch(e){alert(e.message)}}
async function adjT(id,sign){const n=+document.getElementById("tonAmt").value;if(!n||n<=0)return alert("Enter a positive TON amount");
 if(!confirm((sign>0?"Add ":"Remove ")+n+" TON "+(sign>0?"to":"from")+" this user?"))return;
 try{await call("adjustTon",{id,amount:sign*n,reason:document.getElementById("tonWhy").value});user(id)}catch(e){alert(e.message)}}

async function bcView(){load();try{const [list,rc]=await Promise.all([call("broadcasts"),call("reachable")]);
 $("v").innerHTML=`<h2>Broadcast</h2><p>Send a message from your bot to every user. People who blocked the bot are skipped. Keep this page open until it finishes.</p><p style="color:#fff"><b>${rc.reachable}</b> of <b>${rc.total}</b> users can receive bot messages right now. People become reachable when they tap Allow in the app or press Start in the bot.</p>
 <div class="card"><textarea id="bcText" placeholder="Write your message (plain text, up to 3500 characters)"></textarea>
 <input id="bcBtnT" placeholder="Button name (optional), e.g. Open FROG FARM"><input id="bcBtnU" placeholder="Button link (optional), starts with https://">
 <input id="bcTo" inputmode="numeric" placeholder="Your Telegram ID (for a test)"><div class="btns"><button class="alt" onclick="bcTest()">Send test to me</button><button onclick="bcSend()">Send to everyone</button></div><div id="bcProg"></div></div>
 <h2>Recent broadcasts</h2>`+(list.length?list.map(x=>`<div class="card"><small>${esc(String(x.created_at).slice(0,16).replace("T"," "))} · ${esc(x.status)}</small><p style="color:#fff">${esc(x.text.slice(0,120))}</p><div class="row"><span>Delivered ${x.sent} of ${x.total}</span><span>${x.failed} failed</span></div>${x.status==="sending"?`<button style="width:100%" onclick="bcRun(${x.id})">Continue sending</button>`:""}</div>`).join(""):"<p>None yet.</p>")}catch(e){err(e)}}
const bcFields=()=>({text:document.getElementById("bcText").value,btn_text:document.getElementById("bcBtnT").value,btn_url:document.getElementById("bcBtnU").value});
async function bcTest(){try{const r=await call("broadcastTest",Object.assign(bcFields(),{to:document.getElementById("bcTo").value}));alert(r.ok?"Test sent. Check your Telegram.":"Not sent: "+(r.description||"unknown error")+". Open your bot and press Start first.")}catch(e){alert(e.message)}}
async function bcSend(){const f=bcFields();if(!f.text.trim())return alert("Write a message first");if(!confirm("Send this message to ALL users now? This cannot be undone."))return;
 try{const b=await call("broadcastStart",f);bcRun(b.id)}catch(e){alert(e.message)}}
async function bcRun(id){const el=document.getElementById("bcProg");let st,shown=0;
 try{do{st=await call("broadcastStep",{id});if(el)el.innerHTML=`<p style="color:#fff">Sending… ${st.sent+st.failed} of ${st.total} (${st.failed} failed)</p>`;if(st.why&&!shown){shown=1;alert("Messages are failing. Telegram says: "+st.why)}}while(st.status==="sending");
 alert("Done. Delivered "+st.sent+" of "+st.total+".");bcView()}catch(e){alert("Stopped: "+e.message+". Open Broadcast and tap Continue sending.")}}

async function tasksView(){load();try{const d=await call("tasks");
 $("v").innerHTML=`<h2>Tasks</h2><p>Users see the active tasks in order (smallest number first). Changing a reward only affects people who have not done that task yet. To verify a Telegram channel, the bot must be an admin of it. YouTube and WhatsApp links can't be verified.</p>
 <div class="card"><b>Add a new task</b>${tform({id:"",title:"",url:"",reward:300,check_channel:"",active:true,sort:d.length+1},"new")}</div>`+
 d.map((t,i)=>`<div class="card"><b>${esc(t.title)}</b> ${t.active?"":'<span class="tag">hidden</span>'}${tform(t,i)}</div>`).join("")}catch(e){err(e)}}
function tform(t,k){const p="f"+k+"_";return `<input id="${p}title" placeholder="Task name, e.g. Join our channel" value="${esc(t.title)}"><input id="${p}url" placeholder="Link, starting with https://" value="${esc(t.url)}"><div class="grid"><input id="${p}reward" type="number" placeholder="Reward" value="${esc(t.reward)}"><input id="${p}sort" type="number" placeholder="Order" value="${esc(t.sort)}"></div><input id="${p}ch" placeholder="Check Telegram channel (optional) @yourchannel" value="${esc(t.check_channel||"")}"><label style="display:block;margin-top:10px;font-size:14px"><input id="${p}act" type="checkbox" style="width:auto;margin-right:8px" ${t.active?"checked":""}>Show to users</label><div class="btns"><button onclick="saveT('${esc(t.id)}','${k}')">${t.id?"Save":"Add task"}</button>${t.id?`<button class="bad" onclick="delT('${esc(t.id)}')">Delete</button>`:""}</div>`}
async function saveT(id,k){const p="f"+k+"_",g=x=>document.getElementById(p+x);
 try{await call("saveTask",{id,title:g("title").value,url:g("url").value,reward:g("reward").value,sort:g("sort").value,check_channel:g("ch").value,active:g("act").checked});tasksView()}catch(e){alert(e.message)}}
async function delT(id){if(!confirm("Delete this task? Users who already did it keep their FROGS."))return;try{await call("deleteTask",{id});tasksView()}catch(e){alert(e.message)}}

async function adj(id,sign){const n=Math.floor(+document.getElementById("adjAmt").value);if(!n||n<=0)return alert("Enter a positive amount");
 if(!confirm((sign>0?"Add ":"Remove ")+fmt(n)+" FROGS "+(sign>0?"to":"from")+" this user?"))return;
 try{await call("adjust",{id,amount:sign*n,reason:document.getElementById("adjWhy").value});user(id)}catch(e){alert(e.message)}}

async function refBlock(id,b){if(!confirm(b?"Stop this user from earning referral bonuses?":"Allow this user to earn referral bonuses again?"))return;try{await call("refBlock",{id,blocked:b});user(id)}catch(e){alert(e.message)}}
async function refsView(){load();try{const [d,dup,dev]=await Promise.all([call("referrals"),call("duplicates"),call("devices")]);
 const flag=r=>{const f=[];if(r.friends>=3&&r.idle/r.friends>=0.7)f.push("most friends are inactive");if(r.burst>=8)f.push(r.burst+" joined in one hour");if(r.new_24h>=10)f.push(r.new_24h+" new in 24h");return f};
 $("v").innerHTML=`<h2>Referrals</h2><p>Warnings are hints, not proof. Tap a person to review and restrict them.</p>`+(d.length?d.map(r=>{const f=flag(r);return `<div class="card" onclick="user(${r.tg_id})"><div class="row"><b>${esc(r.name||"User")}</b><span>${r.friends} friends</span></div><small>ID ${r.tg_id} · inactive ${r.idle} · tasks done ${r.tasks_done} · withdrew ${r.withdrew} · earned ${fmt(r.earned)}${r.blocked?" · REFERRALS BLOCKED":""}${r.banned?" · BANNED":""}</small>${f.length?`<p style="color:var(--bad)">⚠ ${esc(f.join(" · "))}</p>`:""}</div>`}).join(""):"<p>No referrals yet.</p>")+
 `<h2>Shared wallets</h2><p>Wallets used by more than one account.</p>`+(dup.length?dup.map(x=>`<div class="card"><div class="w">${esc(x.wallet)}</div><small>${x.accounts} accounts: ${x.ids.map(i=>`<a href="#" style="color:#fff" onclick="user(${i});return false">${i}</a>`).join(", ")}</small></div>`).join(""):"<p>None found.</p>")+
 `<h2>Devices with several accounts</h2><p>The first account keeps earning. The others are blocked until you allow them.</p>`+(dev.length?dev.map(g=>`<div class="card"><b>Device ${esc(g.device)}</b> <small>· ${g.count} accounts</small>${g.accounts.map(x=>`<div class="row"><span><a href="#" style="color:#fff" onclick="user(${x.tg_id});return false">${esc(x.name||"User")}</a> <small>· ${x.tg_id}</small><br><small>${x.allowed?"allowed by you":x.blocked?"BLOCKED":"earning"} · ${fmt(x.balance)} FROGS</small></span><button class="alt" style="width:auto;padding:6px 10px" onclick="devAllow(${x.tg_id},${!x.allowed})">${x.allowed?"Remove":"Allow"}</button></div>`).join("")}</div>`).join(""):"<p>None found.</p>")}catch(e){err(e)}}
async function logsView(m){load();try{const d=await call(m==="tx"?"ledger":"logs");
 const bar=`<div class="btns"><button class="${m==="tx"?"":"alt"}" onclick="logsView('tx')">Transactions</button><button class="${m==="admin"?"":"alt"}" onclick="logsView('admin')">Admin actions</button></div>`;
 $("v").innerHTML=`<h2>Logs</h2>${bar}`+(d.length?d.map(l=>m==="tx"?`<div class="row" onclick="user(${l.tg_id})"><span>${esc(l.users&&l.users.first_name||"User")} <small>· ${l.tg_id}</small><br><small>${esc(l.reason)} · ${esc(String(l.created_at).slice(0,16).replace("T"," "))}</small></span><b style="color:${l.amount<0?"var(--bad)":"var(--ok)"}">${l.amount>0?"+":""}${fmt(l.amount)}</b></div>`:`<div class="row"><span><b>${esc(l.action)}</b> <small>· ${esc(l.target||"")}</small><br><small>${esc(l.detail||"")} · ${esc(String(l.at).slice(0,16).replace("T"," "))}</small></span></div>`).join(""):"<p>Nothing yet.</p>")}catch(e){err(e)}}
show();
</script>
</body></html>
